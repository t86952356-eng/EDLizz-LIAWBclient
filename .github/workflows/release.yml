name: Release

on:
  workflow_dispatch:
  push:
    branches: [ 'release/build' ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract versions
        id: versions
        run: |
          set -euo pipefail
          LB_VERSION=$(grep '^mod_version=' gradle.properties | head -n1 | cut -d'=' -f2- | tr -d '[:space:]')
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | head -n1 | cut -d'=' -f2- | tr -d '[:space:]')
          ARCHIVES_NAME=$(grep '^archives_base_name=' gradle.properties | head -n1 | cut -d'=' -f2- | tr -d '[:space:]')
          FORGE_VERSION=$(grep '^forge_version=' gradle.properties | head -n1 | cut -d'=' -f2- | tr -d '[:space:]')
          echo "lb_version=$LB_VERSION" >> "$GITHUB_OUTPUT"
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "archives_name=$ARCHIVES_NAME" >> "$GITHUB_OUTPUT"
          echo "forge_version=$FORGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Lizz: $LB_VERSION | Minecraft: $MC_VERSION | Forge: $FORGE_VERSION"

      - name: Setting up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: gradle

      - name: Build
        env:
          CI: true
        run: ./gradlew build --console=plain

      - name: Collect artifacts
        run: |
          set -euo pipefail
          ARCHIVES_NAME="${{ steps.versions.outputs.archives_name }}"
          LB_VERSION="${{ steps.versions.outputs.lb_version }}"
          mkdir -p dist
          # Mod JAR (shadowed + reobfuscated to SRG names, production-ready)
          cp "build/libs/${ARCHIVES_NAME}-${LB_VERSION}.jar" "dist/${ARCHIVES_NAME}-${LB_VERSION}.jar"
          # Full source archive of the exact built commit
          git archive --format=zip --prefix="${ARCHIVES_NAME}-${LB_VERSION}/" -o "dist/${ARCHIVES_NAME}-${LB_VERSION}-source.zip" HEAD
          ls -lh dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LB_VERSION: ${{ steps.versions.outputs.lb_version }}
          MC_VERSION: ${{ steps.versions.outputs.mc_version }}
          FORGE_VERSION: ${{ steps.versions.outputs.forge_version }}
          ARCHIVES_NAME: ${{ steps.versions.outputs.archives_name }}
        run: |
          set -euo pipefail
          TAG="v${LB_VERSION}-mc${MC_VERSION}"
          TITLE="Lizz [v${LB_VERSION}] — Minecraft ${MC_VERSION} (Forge)"
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Lizz [v${LB_VERSION}] for Minecraft ${MC_VERSION} on Forge.

          - **Client**: Lizz / LAWIB (based on LiquidBounce Legacy)
          - **Minecraft**: ${MC_VERSION}
          - **Loader**: Forge ${FORGE_VERSION}
          - **Java**: Built with JDK 8, runs on Java 8

          **Assets**
          - \`${ARCHIVES_NAME}-${LB_VERSION}.jar\` — the mod JAR. Place it into your \`.minecraft/mods\` folder with Forge ${MC_VERSION} installed.
          - \`${ARCHIVES_NAME}-${LB_VERSION}-source.zip\` — full client source code (GPL-3.0)." \
            || gh release upload "$TAG" dist/* --clobber
